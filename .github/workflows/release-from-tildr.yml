name: Release from Tildr

on:
  schedule:
    - cron: '0 0 * * 6'   # every Saturday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.compare.outputs.new_tag }}
      should_build: ${{ steps.compare.outputs.should_build }}
    steps:
      - name: Get latest tildr release
        id: tildr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo orbitbits/tildr --json tagName -q .tagName 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No release found on orbitbits/tildr"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Latest tildr release: ${TAG}"
          echo "new_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if already published here
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tildr.outputs.new_tag }}"
          if [ -z "$TAG" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release ${TAG} already exists here — skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release detected: ${TAG}"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "new_tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y rpm-build curl git make

      - name: Build RPM
        env:
          PKGVER: ${{ needs.check.outputs.new_tag }}
        run: make build

      - name: Lint spec
        continue-on-error: true
        run: |
          dnf install -y rpmlint
          make lint

      - name: Collect RPMs
        run: |
          mkdir -p rpm/x86_64
          cp rpmbuild/RPMS/x86_64/*.rpm rpm/x86_64/
          find rpm/x86_64 -name '*.rpm' -type f -exec ls -lh {} \;

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: rpm/x86_64/*.rpm
          retention-days: 5

  release:
    needs: [check, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: rpm/x86_64/
          pattern: rpm
          merge-multiple: true

      - name: List RPMs
        run: |
          echo "Downloaded RPMs:"
          find rpm/x86_64/ -name "*.rpm" -exec ls -lh {} \;

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check.outputs.new_tag }}"
          gh release create "$TAG" \
            --title "Release ${TAG}" \
            --generate-notes \
            rpm/x86_64/*.rpm

  publish:
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Trigger packaging publish
        env:
          ORBITBITS_PACKAGING_TOKEN: ${{ secrets.ORBITBITS_PACKAGING_TOKEN }}
        run: |
          export GH_TOKEN="$(printf '%s' "$ORBITBITS_PACKAGING_TOKEN" | tr -d '\r\n')"
          gh api repos/orbitbits/packaging/dispatches \
            -f event_type=publish-package \
            -f client_payload[package_type]=rpm \
            -f client_payload[source_repository]="${{ github.repository }}" \
            -f client_payload[tag]="${{ needs.check.outputs.new_tag }}"
