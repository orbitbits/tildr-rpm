name: Build RPM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y rpm-build curl git make

      - name: Build RPM
        run: make build

      - name: Lint spec
        continue-on-error: true
        run: |
          dnf install -y rpmlint
          make lint

      - name: Collect RPMs
        run: |
          mkdir -p rpm/x86_64
          cp rpmbuild/RPMS/x86_64/*.rpm rpm/x86_64/
          find rpm/x86_64 -name '*.rpm' -type f -exec ls -lh {} \;

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: tildr-rpm
          path: rpm/x86_64/*.rpm
          if-no-files-found: error
          retention-days: 1

  publish-main:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Trigger packaging publish
        env:
          ORBITBITS_PACKAGING_TOKEN: ${{ secrets.ORBITBITS_PACKAGING_TOKEN }}
        run: |
          export GH_TOKEN="$(printf '%s' "$ORBITBITS_PACKAGING_TOKEN" | tr -d '\r\n')"
          gh api repos/orbitbits/packaging/dispatches \
            -f event_type=publish-package \
            -f client_payload[package_type]=rpm \
            -f client_payload[source_repository]="${{ github.repository }}" \
            -f client_payload[run_id]="${{ github.run_id }}" \
            -f client_payload[artifact_pattern]="tildr-rpm"

  srpm:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y rpm-build curl git make

      - name: Build SRPM
        run: make srpm

      - name: Upload SRPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: tildr-srpm
          path: rpmbuild/SRPMS/*.rpm
          retention-days: 1
